name: Full Tests

on: [workflow_dispatch]

jobs:

  build_and_test_p39_p315:
    name: "${{ matrix.os }} + python ${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest", "ubuntu-24.04-arm", "macos-15-intel", "macos-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - name: Use current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - name: Prepare for build
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=67.8.0"
          pip install wheel build
      - name: 👷 Test build from source ⚒️
        run: python -m build --wheel
      - name: 👩‍💻 Test install from GitHub 🌐
        run: pip install git+https://github.com/rathaROG/lapx.git
      - name: Install and check this checkout's wheel
        run: |
          python -m pip install --force-reinstall --no-deps --no-index --find-links=dist lapx
          python .github/tests/check_rh_wheel.py
      - name: Prepare for full tests
        run: python -m pip install -U -r .github/tests/requirements.txt numpy scipy
      - name: Test build and packaging configuration
        run: python -m pytest -q .github/tests
      - name: 🧑‍🔬 Run full tests with pytest 👨‍⚖️
        run: |
          cd tests
          pytest -v
      - name: Archive wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl

  build_and_test_win_arm_p311_p315:
    name: "${{ matrix.os }} + python ${{ matrix.python-version }}"
