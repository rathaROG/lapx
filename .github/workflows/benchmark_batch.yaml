name: Benchmark (Batch)

on: [workflow_dispatch]

jobs:

  benchmark_p39_p315:
    name: "${{ matrix.os }} + python ${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest", "ubuntu-24.04-arm", "macos-15-intel", "macos-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - name: Use current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - name: Install lapx from checkout and scipy
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python tests/check_rh_wheel.py
          pip install scipy
      - name: 📊 Run benchmark_batch.py
        run: |
          cd benchmarks
          python benchmark_batch.py --quick --repeats 2 --seed 2026
